name: Registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate teams and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every team (strict)
        run: node scripts/build-registry.mjs --validate-only
      - name: Run tests
        run: node --test "test/**/*.test.mjs"

  publish:
    name: Regenerate registry.json
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build registry.json
        run: node scripts/build-registry.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- registry.json; then
            echo "registry.json is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "chore: regenerate registry.json [skip ci]"
          git push
